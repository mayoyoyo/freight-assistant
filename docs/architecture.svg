<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 660" role="img" aria-label="Architecture: an offline ingestion pipeline turns the raw dataset into committed files, a seed script loads them into Postgres, a Claude agent answers broker questions through four database tools, and a local eval harness tests the agent against the same data.">
  <title>Freight Carrier Agent — system overview</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1180" height="660" fill="#ffffff"/>

  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">

    <!-- Page title -->
    <text x="30" y="36" font-size="18" font-weight="700" fill="#0f172a">Freight Carrier Agent — system overview</text>

    <!-- ===================== OFFLINE INGESTION BOUNDARY ===================== -->
    <rect x="30" y="60" width="285" height="565" rx="10" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="7 5"/>
    <text x="45" y="84" font-size="12" font-weight="700" letter-spacing="1" fill="#64748b">OFFLINE INGESTION</text>
    <text x="45" y="101" font-size="10.5" fill="#64748b">runs locally, once — outputs committed to repo</text>

    <!-- Raw dataset -->
    <rect x="62" y="120" width="220" height="86" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
    <text x="172" y="142" font-size="13.5" font-weight="600" text-anchor="middle" fill="#0f172a">Raw dataset</text>
    <text x="172" y="161" font-size="11" text-anchor="middle" fill="#475569">274 carrier emails · 55 call</text>
    <text x="172" y="176" font-size="11" text-anchor="middle" fill="#475569">recordings · loads, carriers,</text>
    <text x="172" y="191" font-size="11" text-anchor="middle" fill="#475569">rate history (data/raw/)</text>

    <!-- dataset -> transcribe -->
    <line x1="172" y1="206" x2="172" y2="234" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="182" y="225" font-size="10.5" fill="#64748b">audio (55 calls)</text>

    <!-- emails bypass transcription (right-side elbow) -->
    <path d="M 282 163 H 298 V 363 H 286" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="306" y="263" font-size="10" fill="#64748b" text-anchor="middle" transform="rotate(-90 306 263)">274 emails skip transcription</text>

    <!-- Transcribe -->
    <rect x="62" y="238" width="220" height="62" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
    <text x="172" y="258" font-size="13.5" font-weight="600" text-anchor="middle" fill="#0f172a">1 · Transcribe</text>
    <text x="172" y="275" font-size="11" text-anchor="middle" fill="#475569">Deepgram turns each call into</text>
    <text x="172" y="289" font-size="11" text-anchor="middle" fill="#475569">text, with confidence scores</text>

    <!-- transcribe -> extract -->
    <line x1="172" y1="300" x2="172" y2="328" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="182" y="319" font-size="10.5" fill="#64748b">transcripts</text>

    <!-- Extract -->
    <rect x="62" y="332" width="220" height="62" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
    <text x="172" y="352" font-size="13.5" font-weight="600" text-anchor="middle" fill="#0f172a">2 · Extract</text>
    <text x="172" y="369" font-size="11" text-anchor="middle" fill="#475569">Claude reads the raw text and</text>
    <text x="172" y="383" font-size="11" text-anchor="middle" fill="#475569">pulls out MC#, load, rate, intent</text>

    <!-- extract -> resolve -->
    <line x1="172" y1="394" x2="172" y2="422" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="182" y="413" font-size="10.5" fill="#64748b">structured fields</text>

    <!-- Resolve -->
    <rect x="62" y="426" width="220" height="62" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
    <text x="172" y="446" font-size="13.5" font-weight="600" text-anchor="middle" fill="#0f172a">3 · Resolve</text>
    <text x="172" y="463" font-size="11" text-anchor="middle" fill="#475569">match each message to a known</text>
    <text x="172" y="477" font-size="11" text-anchor="middle" fill="#475569">carrier; flag anything that conflicts</text>

    <!-- resolve -> derived -->
    <line x1="172" y1="488" x2="172" y2="514" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="182" y="506" font-size="10.5" fill="#64748b">records + flags</text>

    <!-- Derived files -->
    <rect x="62" y="518" width="220" height="76" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
    <text x="172" y="539" font-size="13.5" font-weight="600" text-anchor="middle" fill="#0f172a">Derived files (committed)</text>
    <text x="172" y="557" font-size="11" text-anchor="middle" fill="#475569">transcripts + extracted inquiries</text>
    <text x="172" y="571" font-size="11" text-anchor="middle" fill="#475569">live in the repo — the app never</text>
    <text x="172" y="585" font-size="11" text-anchor="middle" fill="#475569">re-does this work</text>

    <!-- ===================== CLOUD BOUNDARY ===================== -->
    <rect x="400" y="60" width="750" height="370" rx="10" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="7 5"/>
    <text x="1135" y="84" font-size="12" font-weight="700" letter-spacing="1" text-anchor="end" fill="#64748b">CLOUD</text>
    <text x="1135" y="101" font-size="10.5" text-anchor="end" fill="#64748b">Vercel runs the app · Neon hosts the database</text>

    <!-- Broker (user) -->
    <rect x="465" y="8" width="150" height="36" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
    <text x="540" y="31" font-size="13" font-weight="600" text-anchor="middle" fill="#0f172a">Broker (user)</text>
    <line x1="540" y1="44" x2="540" y2="136" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="548" y="98" font-size="10.5" fill="#64748b">browser</text>

    <!-- Chat page -->
    <rect x="460" y="140" width="160" height="96" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
    <text x="540" y="162" font-size="13.5" font-weight="600" text-anchor="middle" fill="#0f172a">Chat page</text>
    <text x="540" y="182" font-size="11" text-anchor="middle" fill="#475569">ask questions,</text>
    <text x="540" y="197" font-size="11" text-anchor="middle" fill="#475569">see answers +</text>
    <text x="540" y="212" font-size="11" text-anchor="middle" fill="#475569">which tools ran</text>

    <!-- chat <-> agent -->
    <line x1="620" y1="168" x2="666" y2="168" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="645" y="158" font-size="10" text-anchor="middle" fill="#64748b">question</text>
    <line x1="670" y1="205" x2="624" y2="205" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="645" y="222" font-size="10" text-anchor="middle" fill="#64748b">answer</text>

    <!-- Agent (accent) -->
    <rect x="670" y="140" width="170" height="96" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="755" y="162" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1e3a8a">Agent</text>
    <text x="755" y="182" font-size="11" text-anchor="middle" fill="#1e3a8a">Claude in a tool loop:</text>
    <text x="755" y="197" font-size="11" text-anchor="middle" fill="#1e3a8a">picks tools, reads results,</text>
    <text x="755" y="212" font-size="11" text-anchor="middle" fill="#1e3a8a">answers with source IDs</text>

    <!-- agent <-> tools -->
    <line x1="840" y1="168" x2="891" y2="168" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="867" y="158" font-size="10" text-anchor="middle" fill="#64748b">calls</text>
    <line x1="895" y1="205" x2="844" y2="205" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="867" y="222" font-size="10" text-anchor="middle" fill="#64748b">results</text>

    <!-- Tools -->
    <rect x="895" y="128" width="240" height="124" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
    <text x="1015" y="149" font-size="13.5" font-weight="600" text-anchor="middle" fill="#0f172a">4 tools (typed, narrow)</text>
    <text x="907" y="171" font-size="10.5" fill="#475569"><tspan font-weight="600">get_load</tspan> — one load's details</text>
    <text x="907" y="189" font-size="10.5" fill="#475569"><tspan font-weight="600">search_inquiries</tspan> — find messages</text>
    <text x="907" y="207" font-size="10.5" fill="#475569"><tspan font-weight="600">carrier_history</tspan> — profile, compliance</text>
    <text x="907" y="225" font-size="10.5" fill="#475569"><tspan font-weight="600">market_rate</tspan> — average $/mile (SQL)</text>

    <!-- tools -> postgres -->
    <line x1="1015" y1="252" x2="1015" y2="296" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="1007" y="280" font-size="10.5" text-anchor="end" fill="#64748b">SQL, read-only</text>

    <!-- Postgres -->
    <rect x="895" y="300" width="240" height="100" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
    <text x="1015" y="326" font-size="13.5" font-weight="600" text-anchor="middle" fill="#0f172a">Postgres database (Neon)</text>
    <text x="1015" y="347" font-size="11" text-anchor="middle" fill="#475569">loads · carriers · rate history ·</text>
    <text x="1015" y="362" font-size="11" text-anchor="middle" fill="#475569">inquiries (full-text searchable)</text>

    <!-- ===================== EVAL HARNESS (sidecar) ===================== -->
    <rect x="440" y="470" width="330" height="120" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
    <text x="605" y="494" font-size="13.5" font-weight="700" text-anchor="middle" fill="#78350f">Eval harness — pnpm eval (local)</text>
    <text x="605" y="516" font-size="11" text-anchor="middle" fill="#78350f">~24 test questions with known answers</text>
    <text x="605" y="532" font-size="11" text-anchor="middle" fill="#78350f">code checks + a calibrated Claude judge</text>
    <text x="605" y="548" font-size="11" text-anchor="middle" fill="#78350f">writes evals/report.md (pass rates + CIs)</text>
    <text x="605" y="570" font-size="10.5" font-style="italic" text-anchor="middle" fill="#92400e">same instrument re-run after every change</text>

    <!-- eval -> agent -->
    <line x1="755" y1="470" x2="755" y2="240" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="763" y="380" font-size="10.5" fill="#64748b">asks test questions</text>

    <!-- eval -> postgres -->
    <path d="M 770 515 H 980 V 406" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="785" y="507" font-size="10.5" fill="#64748b">checks answers against the same data</text>

    <!-- ===================== SEED (one-time load) ===================== -->
    <path d="M 172 594 V 640 H 1050 V 406" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
    <text x="610" y="630" font-size="11" text-anchor="middle" fill="#64748b">pnpm seed — loads all committed data into the database (one-time, re-runnable)</text>

  </g>
</svg>
